name: 'Push Image to ECR'
description: 'Authenticate with ECR, validate tags, and push a Docker image'

inputs:
  ecr-repository:
    description: 'ECR repository name (e.g., s/heroku/widgetsrus/widgetsrus)'
    required: true
  image-tag:
    description: 'Image tag to use (e.g., ${{ github.sha }})'
    required: true
  image-name:
    description: 'Local Docker image name to push (defaults to ecr-repository:image-tag)'
    required: false
    default: ''
  aws-region:
    description: 'AWS region for ECR'
    required: false
    default: 'us-east-1'
  aws-role-arn:
    description: 'AWS IAM role ARN for OIDC authentication'
    required: false
    default: 'arn:aws:iam::970597968373:role/ecr-repo-gha-oidc-iam-role'
  architectures:
    description: 'Comma-separated list of architectures for multi-arch build (e.g., "amd64,arm64"). Leave empty for single-arch.'
    required: false
    default: ''

outputs:
  image-uri:
    description: 'Full ECR image URI that was pushed'
    value: ${{ steps.push.outputs.image-uri }}
  registry:
    description: 'ECR registry URL'
    value: ${{ steps.login-ecr.outputs.registry }}

runs:
  using: 'composite'
  steps:
    - name: Validate image tag
      shell: bash
      run: |
        TAG="${{ inputs.image-tag }}"
        
        # ECR tag requirements:
        # - 1-128 characters
        # - Must start with alphanumeric character
        # - Can contain: a-z, A-Z, 0-9, hyphens, underscores, periods, forward slashes
        if ! echo "$TAG" | grep -qE '^[a-zA-Z0-9][a-zA-Z0-9._/-]{0,127}$'; then
          echo "❌ Invalid image tag: $TAG"
          echo ""
          echo "ECR tag requirements:"
          echo "  - Must be 1-128 characters"
          echo "  - Must start with alphanumeric character (a-z, A-Z, 0-9)"
          echo "  - Can contain: letters, numbers, hyphens, underscores, periods, slashes"
          echo "  - Cannot start with period or hyphen"
          exit 1
        fi
        
        echo "✅ Valid image tag: $TAG"

    - name: Configure AWS credentials for ECR
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Tag and push image to ECR
      id: push
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        LOCAL_IMAGE: ${{ inputs.image-name }}
        ARCHITECTURES: ${{ inputs.architectures }}
      run: |
        ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
        
        if [ -z "$ARCHITECTURES" ]; then
          # Single-arch push
          if [ -z "$LOCAL_IMAGE" ]; then
            SOURCE_IMAGE="${ECR_IMAGE}"
          else
            SOURCE_IMAGE="$LOCAL_IMAGE"
          fi
          
          echo "📦 Tagging image: $SOURCE_IMAGE → $ECR_IMAGE"
          docker tag "$SOURCE_IMAGE" "$ECR_IMAGE"
          
          echo "⬆️  Pushing image to ECR: $ECR_IMAGE"
          docker push "$ECR_IMAGE"
          
          echo "✅ Successfully pushed to ECR"
        else
          # Multi-arch push
          IFS=',' read -ra ARCHS <<< "$ARCHITECTURES"
          ARCH_IMAGES=()
          
          for ARCH in "${ARCHS[@]}"; do
            ARCH_TAG="${ECR_IMAGE}-${ARCH}"
            
            if [ -z "$LOCAL_IMAGE" ]; then
              SOURCE_IMAGE="${ARCH}"
            else
              SOURCE_IMAGE="${LOCAL_IMAGE}-${ARCH}"
            fi
            
            echo "📦 Tagging ${ARCH} image: $SOURCE_IMAGE → $ARCH_TAG"
            docker tag "$SOURCE_IMAGE" "$ARCH_TAG"
            
            echo "⬆️  Pushing ${ARCH} image: $ARCH_TAG"
            docker push "$ARCH_TAG"
            
            ARCH_IMAGES+=("$ARCH_TAG")
          done
          
          echo "📋 Creating manifest: $ECR_IMAGE"
          docker manifest create "$ECR_IMAGE" "${ARCH_IMAGES[@]}"
          
          echo "⬆️  Pushing manifest: $ECR_IMAGE"
          docker manifest push "$ECR_IMAGE"
          
          echo "✅ Successfully pushed multi-arch image to ECR"
        fi
        
        echo "image-uri=$ECR_IMAGE" >> $GITHUB_OUTPUT
