name: 'Push Image to ECR'
description: 'Authenticate with ECR, validate tags, and push a Docker image'

inputs:
  ecr-repository:
    description: 'ECR repository name (e.g., s/heroku/widgetsrus/widgetsrus)'
    required: true
  image-tag:
    description: 'Image tag to use (e.g., commit SHA or version number)'
    required: true
  aws-region:
    description: 'AWS region for ECR'
    required: false
    default: 'us-east-1'
  aws-role-arn:
    description: 'AWS IAM role ARN for OIDC authentication'
    required: false
    default: 'arn:aws:iam::970597968373:role/ecr-repo-gha-oidc-iam-role'
  architectures:
    description: 'Comma-separated list of architectures for multi-arch build (e.g., "amd64,arm64"). Leave empty for single-arch.'
    required: false
    default: ''

outputs:
  image-uri:
    description: 'Full ECR image URI that was pushed'
    value: ${{ steps.push.outputs.image-uri }}
  registry:
    description: 'ECR registry URL'
    value: ${{ steps.login-ecr.outputs.registry }}

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        chmod +x "${{ github.action_path }}/validate-inputs.sh"
        "${{ github.action_path }}/validate-inputs.sh" \
          "${{ inputs.ecr-repository }}" \
          "${{ inputs.image-tag }}" \
          "${{ github.repository }}"

    - name: Configure AWS credentials for ECR
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Tag and push image to ECR
      id: push
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        ARCHITECTURES: ${{ inputs.architectures }}
      run: |
        ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
        
        if [ -z "$ARCHITECTURES" ]; then
          # Single-arch push
          # Assume image is built with tag matching the repository name
          REPO_NAME=$(basename "$ECR_REPOSITORY")
          SOURCE_IMAGE="${REPO_NAME}:${IMAGE_TAG}"
          
          echo "📦 Tagging image: $SOURCE_IMAGE → $ECR_IMAGE"
          docker tag "$SOURCE_IMAGE" "$ECR_IMAGE"
          
          echo "⬆️  Pushing image to ECR: $ECR_IMAGE"
          docker push "$ECR_IMAGE"
          
          echo "✅ Successfully pushed to ECR"
        else
          # Multi-arch push
          # Images are expected to be built with tags matching architecture names (e.g., "amd64", "arm64")
          IFS=',' read -ra ARCHS <<< "$ARCHITECTURES"
          ARCH_IMAGES=()
          
          for ARCH in "${ARCHS[@]}"; do
            ARCH_TAG="${ECR_IMAGE}-${ARCH}"
            SOURCE_IMAGE="${ARCH}"
            
            echo "📦 Tagging ${ARCH} image: $SOURCE_IMAGE → $ARCH_TAG"
            docker tag "$SOURCE_IMAGE" "$ARCH_TAG"
            
            echo "⬆️  Pushing ${ARCH} image: $ARCH_TAG"
            docker push "$ARCH_TAG"
            
            ARCH_IMAGES+=("$ARCH_TAG")
          done
          
          echo "📋 Creating manifest: $ECR_IMAGE"
          docker manifest create "$ECR_IMAGE" "${ARCH_IMAGES[@]}"
          
          echo "⬆️  Pushing manifest: $ECR_IMAGE"
          docker manifest push "$ECR_IMAGE"
          
          echo "✅ Successfully pushed multi-arch image to ECR"
        fi
        
        echo "image-uri=$ECR_IMAGE" >> $GITHUB_OUTPUT
