name: Docker
on:
  push:
    branches:
      - "master"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC authentication with ECR
      contents: read
    env:
      # Source registry path (see terraform/data/container-images.csv in heroku/runtime-ecr-terraform).
      ECR_PATH: s/heroku/shaas/shaas
      # Publication actions are pinned to 15442822dd4f (heroku/kubernetes#2500, unmerged branch
      # dh/publication-actions). Re-pin all three to a master SHA once #2498 and #2500 merge.
    steps:
      - uses: actions/checkout@v4
      # Build each platform once and push it to ECR first. Nothing below rebuilds: the index is
      # made from these digests and RR is copied from ECR by digest (docs/release-publication.md).
      - name: Login to ECR
        id: ecr
        uses: heroku/kubernetes/actions/ecr/login@master
        timeout-minutes: 5
      - name: Build platform images and push them to ECR
        id: build
        timeout-minutes: 30
        env:
          ECR_REPO: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_PATH }}
          ARCHITECTURES: ${{ secrets.ARCHITECTURES }}
        run: |
          set -euo pipefail
          IFS=',' read -ra archs <<<"$ARCHITECTURES"
          [[ ${#archs[@]} -gt 0 && -n "${archs[0]}" ]] || { echo "::error::ARCHITECTURES is empty"; exit 1; }
          digests=() images=() platforms=()
          for arch in "${archs[@]}"; do
            [[ "$arch" =~ ^[a-z0-9]+$ ]] || { echo "::error::invalid architecture: $arch"; exit 1; }
            ref="$ECR_REPO:$GITHUB_SHA-$arch"
            # ECR tags are immutable: reuse an image a failed earlier run already pushed.
            if digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
              echo "$ref already present ($digest); reusing, not rebuilding"
            else
              # --provenance/--sbom=false: the image has never carried attestations, and an
              # attestation manifest would add a platform-less child to the index.
              docker buildx build --platform "linux/$arch" --build-arg "ARCH=$arch" -f Dockerfile \
                --provenance=false --sbom=false --push --metadata-file "$RUNNER_TEMP/$arch.json" -t "$ref" .
              digest="$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/$arch.json")"
            fi
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no valid digest for $ref: '$digest'"; exit 1; }
            digests+=("$digest")
            images+=("$ref@$digest")
            platforms+=("linux/$arch")
          done
          {
            echo "digests<<EOF_DIGESTS"
            printf '%s\n' "${digests[@]}"
            echo "EOF_DIGESTS"
            echo "images<<EOF_IMAGES"
            printf '%s\n' "${images[@]}"
            echo "EOF_IMAGES"
            echo "platforms=${platforms[*]}"
          } >>"$GITHUB_OUTPUT"
      - name: Create the multi-platform index in ECR
        id: index
        uses: heroku/kubernetes/actions/publication/create-index@15442822dd4fc43877617367ffdc8ca117d64d69
        with:
          repository: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_PATH }}
          tag: ${{ github.sha }}
          digests: ${{ steps.build.outputs.digests }}
      # RR-only: copy identical content (by digest) to RR. Delete this step and the rr-prefix of
      # the verify step when RR is retired.
      - name: Copy images to Runtime Registry (RR)
        uses: heroku/kubernetes/actions/publication/copy-to-rr@15442822dd4fc43877617367ffdc8ca117d64d69
        timeout-minutes: 10
        with:
          # The index plus the <sha>-<arch> images, so RR keeps the per-arch tags it had before.
          images: |
            ${{ steps.index.outputs.image }}
            ${{ steps.build.outputs.images }}
          source-prefix: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_PATH }}
          rr-prefix: ${{ secrets.RUNTIME_REGISTRY }}/s/${{ secrets.SERVICE_USERNAME }}/shaas
          runtime-registry: ${{ secrets.RUNTIME_REGISTRY }}
          token-service-endpoint: ${{ secrets.SERVICETOKEN_ENDPOINT }}
          service-username: ${{ secrets.SERVICE_USERNAME }}
          service-password: ${{ secrets.SERVICE_PASSWORD }}
      # Fails closed unless the index and every platform are identical in ECR and RR. Anything that
      # advertises the release (manifest or release uploads) must come after this step.
      - name: Verify publication
        uses: heroku/kubernetes/actions/publication/verify@15442822dd4fc43877617367ffdc8ca117d64d69
        with:
          images: ${{ steps.index.outputs.image }}
          platforms: ${{ steps.build.outputs.platforms }}
          source-prefix: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_PATH }}
          rr-prefix: ${{ secrets.RUNTIME_REGISTRY }}/s/${{ secrets.SERVICE_USERNAME }}/shaas
